<!DOCTYPE html>
<html ng-app="app">
<head>
	<meta charset="utf-8">
	<meta name="msapplication-tap-highlight" content="no">
	<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">
	<link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" type="text/css" href="css/materialize.min.css">
	<link  rel="stylesheet" type="text/css" href="css/index.css">
	<link  rel="stylesheet" type="text/css" href="css/animate.css">
	<title>FacturON</title>
	<style>
		.database{border: 1px grey solid}
	</style>
</head>
<body ng-controller='config' ng-cloak>
	<!-- absolute obscure -->
	<div class="fullscreen" ng-show="preloaderShow" ng-cloak></div>

	<!-- MENU PRINCIPAL-->
	<div class="navbar-fixed" ng-cloak>
		<nav class=" blue">
			<div class="nav-wrapper" style="z-index: 5;">
				<a href="#!" class="brand-logo"><i class="logo">FacturON</i><span style="font-size: .6em">config</span></a>
				<ul class="right">
        			<li><a href="" ng-click="save()"><i class="material-icons">save</i></a></li>
			    </ul>
			</div>			
			<loading/>
		</nav>
	</div>


<div class="container">
	<div class="row" ng-hide="data.length == 0">

		<div class="col s12">
          <div class="card">
            <div class="card-content">
            	<span class="card-title">FacturON</span>
            	<form class="row" >
            		<div class="col s12">
            			<div class="input-field col s6" >
				          	<input placeholder="Puerto HTTP" type="text" class="validate" required ng-model="data.port">
				        	<label class="active">Port</label>
				       </div>
            		</div>	
            	</form>
              
            </div>
          </div>
        </div>

        <div class="col s12">
          <div class="card">
            <div class="card-content">
            	<span class="card-title">Emisores de Comprobantes       <i class="material-icons" ng-click="add()" style="cursor: pointer;" >add</i></span>
            	<form class="row" ng-repeat="i in data.databases track by $index" style="margin-top: 1em">
            		<div class="database col s12">
            			<div class="input-field col s6" >
				          	<input placeholder="R.U.C." type="text" class="validate" required ng-model="i.ruc">
				        	<label class="active">R.U.C.</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Nombre Comercial" type="text" class="validate" required ng-model="i.nombreComercial">
				          <label class="active">Nombre Comercial</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Logo" type="text" class="validate" required ng-model="i.img">
				          <label class="active">Logo Empresa</label>
				       </div>
	            		<div class="input-field col s6">
				          <input placeholder="Usuario" type="text" class="validate" required ng-model="i.user">
				          <label class="active">Usuario Base de Datos</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Contraseña" type="password" class="validate" required ng-model="i.pass">
				          <label class="active">Contraseña Base de Datos</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Host" type="text" class="validate" required ng-model="i.host">
				          <label class="active">Host Base de Datos</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Port" type="text" class="validate" required ng-model="i.port">
				          <label class="active">Puerto Base de Datos</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Host Mail" type="text" class="validate" required ng-model="i.mail.host">
				          <label class="active">Host Mail</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Puerto Mail" type="text" class="validate" required ng-model="i.mail.port">
				          <label class="active">Puerto Mail</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Correo" type="text" class="validate" required ng-model="i.mail.auth.user">
				          <label class="active">Correo</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Contraseña Correo" type="password" class="validate" required ng-model="i.mail.auth.pass">
				          <label class="active">Contraseña Correo</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Correos por defecto" type="text" class="validate" required ng-model="i.mail.mailsDefault">
				          <label class="active">Correos por defecto</label>
				       </div>
            		</div>
            		
            	</form>
              
            </div>
          </div>
        </div>

        <div class="col s12">
          <div class="card">
            <div class="card-content">
            	<span class="card-title">Uploader Facturas</span>
            	<form class="row" >
            		<div class="col s12">
            			<div class="input-field col s6" >
				          	<input placeholder="Tabla Cabecera" type="text" class="validate" required ng-model="data.tables.cabecera">
				        	<label class="active">Tabla Cabecera</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Tabla Movimiento" type="text" class="validate" required ng-model="data.tables.movimiento">
				          <label class="active">Tabla Movimientos</label>
				       </div>
				       <div class="input-field col s6">
				          <input placeholder="Tabla de Archivos" type="text" class="validate" required ng-model="data.tables.file">
				          <label class="active">Tabla de Archivos</label>
				       </div>
            		</div>	
            	</form>
              
            </div>
          </div>
        </div>
     </div>
</div>

   <div id="login" class="modal">
    <div class="modal-content">
      <h4> Acceso a configuración </h4>
      <form id="login" ng-submit="login()">
      	<div class="input-field col s6">
          <input placeholder="Key de Acceso" type="password" class="validate" required ng-model="datum.key">
       </div>
      </form>
      
    </div>
    <div class="modal-footer">
      <button type="submit" href="#!" class="modal-close waves-effect waves-green btn-flat blue white-text" form="form">Entrar</a>
    </div>
  </div>


	<script src="js/jquery.js"></script>
	<script src="js/moment.min.js"></script>
	<script src="js/materialize.min.js"></script>
	<script src="js/angular.js"></script>
	<script src="js/index.js"></script>
	<script src="main.js"></script>

</body>
</html>
